name: CI Regression & Adversarial Verification Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-contracts:
    name: Backend Contract Tests & Audit Integrity
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed Fictional Customers Database
        run: |
          python scripts/seed.py

      - name: Run Backend Contract Tests
        run: |
          pytest tests -v

      - name: Run Deterministic Safety & Scenario Evals
        run: |
          python evals/run_evals.py

      - name: Run Independent Audit Verification Checks
        run: |
          python scripts/verify_audit.py

  adversarial-evals:
    name: Adversarial Evaluation & Regulatory Gate
    runs-on: ubuntu-latest
    needs: [backend-contracts]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Adversarial Evaluation Runner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INTERNAL_API_TOKEN: "dev-internal-token"
        run: |
          python evals/run_adversarial_evals.py
