name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest + offline evals (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q
      - name: Offline scenario and safety evals
        run: python evals/run_evals.py
      - name: Offline adversarial suite
        run: python evals/run_offline_adversarial.py
      # Deliberately absent: evals/run_adversarial_evals.py. It calls the live Gemini API and
      # needs keys; its results in evals/adversarial_eval_results.json are from a prior manual run.
