# Local demo stack. Copy .env.example to .env and set both tokens first:
#   INTERNAL_API_TOKEN  (agent -> backend)    OPERATOR_API_TOKEN  (dashboard -> backend)
# Compose refuses to start if either is missing; there are no default tokens.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      OPERATOR_API_TOKEN: ${OPERATOR_API_TOKEN:?set OPERATOR_API_TOKEN in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_SIP_TRUNK_ID: ${LIVEKIT_SIP_TRUNK_ID:-}
    volumes:
      - backend_db:/app/db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_OPERATOR_TOKEN: ${OPERATOR_API_TOKEN:?set OPERATOR_API_TOKEN in .env}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Needs real LiveKit + model-provider keys. Nothing in this repo dispatches jobs to it yet.
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    restart: unless-stopped
    profiles: ["agent"]
    environment:
      BACKEND_API_URL: http://backend:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
    depends_on:
      - backend

volumes:
  backend_db:
